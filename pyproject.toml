[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleNMRjeolTools"
version = "1.0.0"
description = "JEOL/JASON client for simpleNMR — converts .jjh5 NMR data and submits it for structure elucidation"
readme = "README.md"
license = "MIT"
authors = [{name = "Eric Hughes", email = "erichughesabc@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "simpleNMRbuilder[gui,viewer] @ git+https://github.com/EricHughesABC/simpleNMRbuilder.git",
    "h5py>=3.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "fire>=0.5.0",
    "rdkit>=2023.9.1",
    "requests>=2.31.0",
]
# PyQt5 is deliberately NOT listed. simpleNMRbuilder[viewer] installs
# PySide6 for the shared HTML result viewer; PyQt5 alongside PySide6 in
# the same environment caused a confirmed real crash (macOS Objective-C
# class collisions + a fatal QWidget/QApplication error, 2026-08-27) when
# this project still depended on guidata. guidata has since been removed
# from the Bruker converter for the same reason — don't reintroduce PyQt5
# here either, even transitively.

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
simplenmr-jeol = "simplenmrjeol.jason_simpleNMR_cli:main"

[project.urls]
Repository = "https://github.com/EricHughesABC/simpleNMRjeolTools3"

[tool.setuptools.packages.find]
where = ["src"]
include = ["simplenmrjeol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
